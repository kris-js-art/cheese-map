name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chesov
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d chesov"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/chesov
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build (without tests)
        run: mvn -B -DskipTests package

      - name: Run tests and coverage report
        run: mvn -B verify

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is not set. Skipping SonarQube analysis."
            exit 0
          fi
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=kris-js-art_cheese-map

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    needs: [backend, frontend]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
          RAILWAY_FRONTEND_SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
        run: |
          RAILWAY_TOKEN="$(printf '%s' "${RAILWAY_TOKEN}" | tr -d '\r\n' | xargs)"
          RAILWAY_ENVIRONMENT_ID="$(printf '%s' "${RAILWAY_ENVIRONMENT_ID}" | tr -d '\r\n' | xargs)"
          RAILWAY_BACKEND_SERVICE_ID="$(printf '%s' "${RAILWAY_BACKEND_SERVICE_ID}" | tr -d '\r\n' | xargs)"
          RAILWAY_FRONTEND_SERVICE_ID="$(printf '%s' "${RAILWAY_FRONTEND_SERVICE_ID}" | tr -d '\r\n' | xargs)"

          if [ -z "${RAILWAY_TOKEN}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID}" ] || [ -z "${RAILWAY_BACKEND_SERVICE_ID}" ] || [ -z "${RAILWAY_FRONTEND_SERVICE_ID}" ]; then
            echo "Missing required GitHub config."
            echo "Required:"
            echo "- secret RAILWAY_TOKEN"
            echo "- secret RAILWAY_ENVIRONMENT_ID"
            echo "- secret RAILWAY_BACKEND_SERVICE_ID"
            echo "- secret RAILWAY_FRONTEND_SERVICE_ID"
            exit 1
          fi

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ secrets.RAILWAY_BACKEND_SERVICE_ID }}
        run: |
          railway up \
            --service "${RAILWAY_BACKEND_SERVICE_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_ID}" \
            --path-as-root . \
            --detach

      - name: Deploy frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_FRONTEND_SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
        run: |
          railway up \
            --service "${RAILWAY_FRONTEND_SERVICE_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_ID}" \
            --path-as-root frontend \
            --detach


  healthcheck:
    name: Post-deploy Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check deployed app health
        env:
          APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
        run: |
          APP_HEALTHCHECK_URL="$(printf '%s' "${APP_HEALTHCHECK_URL}" | tr -d '\r\n' | xargs)"

          if [ -z "${APP_HEALTHCHECK_URL}" ]; then
            echo "Missing required GitHub variable APP_HEALTHCHECK_URL"
            exit 1
          fi


          echo "Healthcheck URL: ${APP_HEALTHCHECK_URL}"

          for attempt in {1..30}; do
            http_code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "${APP_HEALTHCHECK_URL}" || true)
            if [ "${http_code}" = "200" ] && grep -q '"status":"UP"' /tmp/health.json; then
              echo "Healthcheck passed on attempt ${attempt}"
              cat /tmp/health.json
              exit 0
            fi

            echo "Attempt ${attempt}/30 failed (HTTP ${http_code}). Retrying in 10s..."
            sleep 10
          done

          echo "Healthcheck failed after all retries. Last response:"
          cat /tmp/health.json || true
          exit 1
